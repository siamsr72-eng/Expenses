
name: Build Expenses APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f mess-android-wrapper/settings.gradle ] || [ -f mess-android-wrapper/settings.gradle.kts ]; then
            echo "dir=mess-android-wrapper" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: Android project not found."
            exit 1
          fi

      - name: Make Gradle wrapper executable
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.dir }}"
          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
          fi

      - name: Build debug APK
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.dir }}"
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Verify app package name
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.dir }}"
          grep -R -n 'applicationId' \
            "$PROJECT_DIR/app/build.gradle" \
            "$PROJECT_DIR/app/build.gradle.kts" 2>/dev/null || true

      - name: Find APK
        id: apk
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.dir }}"
          APK_PATH=$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/*/*.apk' \
            ! -path '*/androidTest/*' | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK generated."
            exit 1
          fi

          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK_PATH"

      - name: Upload Expenses APK
        uses: actions/upload-artifact@v4
        with:
          name: Expenses-debug-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
